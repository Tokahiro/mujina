version: 2
updates:
  # Compatible updates in one weekly pull request; majors come one by one.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      compatible:
        update-types: [minor, patch]

  # The workflows pin actions to commit hashes; this keeps the hashes and their comments current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
