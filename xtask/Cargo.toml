[package]
name = "xtask"
description = "Project automation for Mujina: architecture and translation checks, version check, MSIX packaging, launcher and device skeletons."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.mujina]
# The crate's ring (docs/architecture.md); cargo xtask arch-check checks its dependencies.
ring = "tool"

[dependencies]
rspolib.workspace = true
serde_json.workspace = true
# The device profiles, read for the ids they take (new-device).
toml.workspace = true

[dev-dependencies]
# The skeletons' Rust files are checked to parse.
syn = { workspace = true, features = ["full"] }

[lints]
workspace = true
