[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
ignore = [
    # Both come in through Slint (1.18 and 1.19) and have no maintained release.
    # Drop each ignore once Slint no longer depends on the crate.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; i-slint-core depends on it, no fixed version" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils is unmaintained; Slint's spin_on depends on it, no fixed version" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "CC0-1.0",
    # Slint (ADR-0011): free for desktop apps that show its badge (condition 2 (b)), as the
    # README, every release page and Mujina Settings' Help page do.
    "LicenseRef-Slint-Royalty-free-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "slint", wrappers = ["mujina-settings-gui", "mujina-setup"], reason = "the resident agent has no UI" },
    { crate = "slint-build", wrappers = ["mujina-settings-gui", "mujina-setup"], reason = "the resident agent has no UI" },
    { crate = "tokio", reason = "no async runtime: the agent sleeps on kernel objects (ADR-0002)" },
    { crate = "async-std", reason = "no async runtime: the agent sleeps on kernel objects (ADR-0002)" },
    { crate = "smol", reason = "no async runtime: the agent sleeps on kernel objects (ADR-0002)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
