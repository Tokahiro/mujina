[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# No ignores: every advisory fails the check. (Slint 1.18 dropped paste, ttf-parser and rustybuzz,
# the unmaintained crates that were ignored here.)

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "CC0-1.0",
    # Slint, for the two apps with a window, Mujina Settings and Mujina Setup (ADR-0011). Free
    # for desktop apps with the Slint attribution: the README and every release page show
    # Slint's badge (the licence's condition 2 (b)), and so does Mujina Settings' Help page.
    "LicenseRef-Slint-Royalty-free-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Promises checked here rather than only written down: the UI toolkit stays in the two apps that
# have a window (ADR-0011), and nothing brings an async runtime into the resident agent (ADR-0002).
deny = [
    { crate = "slint", wrappers = ["mujina-settings-gui", "mujina-setup"], reason = "the resident agent has no UI" },
    { crate = "slint-build", wrappers = ["mujina-settings-gui", "mujina-setup"], reason = "the resident agent has no UI" },
    { crate = "tokio", reason = "no async runtime: the agent sleeps on kernel objects (ADR-0002)" },
    { crate = "async-std", reason = "no async runtime: the agent sleeps on kernel objects (ADR-0002)" },
    { crate = "smol", reason = "no async runtime: the agent sleeps on kernel objects (ADR-0002)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
