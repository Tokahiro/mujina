[package]
name = "mujina-adapter-keyboard"
description = "Devices whose buttons arrive as key chords (profiles/devices/*.toml and a button of one's own), the keyboard hook that catches them and the keys Mujina sends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.mujina]
# The crate's ring (docs/architecture.md); cargo xtask arch-check checks its dependencies.
ring = "adapter"

[dependencies]
mujina-adapter-kit.workspace = true
mujina-application.workspace = true
mujina-domain.workspace = true
log = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
toml.workspace = true

[target.'cfg(windows)'.dependencies]
mujina-winutil.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The devices' conformance test.
mujina-application = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
