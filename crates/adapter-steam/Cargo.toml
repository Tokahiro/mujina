[package]
name = "mujina-adapter-steam"
description = "Steam Big Picture as a Mujina launcher."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.mujina]
# The crate's ring (docs/architecture.md); cargo xtask arch-check checks its dependencies.
ring = "adapter"

[dependencies]
mujina-adapter-kit.workspace = true
mujina-application.workspace = true
mujina-domain.workspace = true
log.workspace = true
serde_json.workspace = true
tungstenite = { workspace = true, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
mujina-winutil.workspace = true
# The WLAN service's notification codes and errors, for the Wi-Fi reader.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WiFi",
] }

[dev-dependencies]
# The descriptor's conformance test.
mujina-application = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
