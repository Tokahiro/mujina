[package]
name = "mujina-adapter-windows"
description = "Windows implementations of Mujina's ports: full screen experience, home app setting, the event loop, the machine's identity, logging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.mujina]
# The crate's ring (docs/architecture.md); cargo xtask arch-check checks its dependencies.
ring = "adapter"

[dependencies]
mujina-application.workspace = true
mujina-domain.workspace = true
log = { workspace = true, features = ["std"] }

[target.'cfg(windows)'.dependencies]
mujina-winutil.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
